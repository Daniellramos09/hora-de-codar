<html>

<head>

	<script>

		// Aqui criamos uma variavel global. Global significa que o elemento pode ser acessado por qualquer método. Para tornar global, utilizamos a palavra static.


		var nome = String(prompt("Olá! Digite seu nome:"))
		alert("Olá! " + nome + "! É um prazer ter você por aqui!")






		var senha = 3589;

		var saldo = 100.5;
		function inicio() {

			var escolha = parseInt(prompt('Selecione uma opção 1.) Saldo 2.) Extrato 3.) Saque 4.) Depósito 5.) Transferência 6.) Sair'))


			switch (escolha) {
				case 1:
					ver_saldo();
					break;
				case 2:
					extrato()
					break;
				case 3:
					fazer_saque();
					break;
				case 4:
					fazer_deposito();
					break;
				case 5:
					transferencia();
					break;
				case 6:
					sair();
					break;
				default:
					erro();
			}
		}


		/*  Função principal. */
		function ver_saldo() {
			var validar = parseInt(prompt("Informe a senha: "))
			if (validar === senha) {
				alert('Seu saldo atual é: ' + saldo);
				inicio();
			}
			else {
				alert("Senha incorreta")
				extrato()
			}
		}

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_deposito() {
			var deposito = parseFloat(prompt('Qual o valor para depósito?'));
			// Not a Number
			if (isNaN(deposito) || deposito === '') { // A Função isNaN checa se o valor informado é um Não-Número e retorna verdadeiro ou falso.
				alert('Por favor, informe um número:');
				fazer_deposito();
			}

			if (deposito <= 0) {
				alert("Operação não autorizada")
				fazer_saque();
			}

			else {
				saldo += deposito;
				ver_saldo();
			}
		}

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_saque() {
			var validar = parseInt(prompt("Informe a senha: "))
			if (validar === senha) {
				var saque = parseFloat(prompt('Qual o valor para saque?'));


				if (isNaN(saque) || saque === '') {
					alert('Por favor, informe um número:');
					fazer_saque();
				}
				if (saldo - saque < 0) {
					alert('Por favor, informe um número:');
					fazer_saque();
				}
				if (saque <= 0) {
					alert("Operação não autorizada")
					fazer_saque();
				}
				else {
					saldo -= saque
					ver_saldo();
				}

			}
			else {
				alert("Senha incorreta")
				extrato()
			}
		}

		/* Verificar se há um erro */
		function erro() {
			alert('Por favor, informe um número entre 1 a 4');
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {
				alert(nome + ", foi um prazer ter você por aqui!")
				window.close();
			} else {
				inicio();
			}
		}

		function extrato() {
			var validar = parseInt(prompt("Informe a senha: "))
			if (validar === senha) {
				alert("macarrão, " + "depósito de R$10,00 de daniela")
				inicio()
			}

			else {
				alert("Senha invalida")
				extrato();
			}

		}

		function transferencia() {
			var validar = parseInt(prompt("Informe a senha: "))

			if (validar === senha) {
				var conta = parseInt(prompt("Insira o numero da conta: "))
				var value = parseFloat(prompt("insira o valor de transferência: "))

				if (saldo - value < 0) {
					alert("Operação não autorizada, informe um valor menor que possui em saldo")
					transferencia()
				}

				if (value <= 0) {
					alert("Operação não autorizada, não é possivel enviar R$0,00 ou menor, transfira um valor maior que zero")
					transferencia()

				}

				else {
					saldo -= value
					ver_saldo()
				}
			}
			else {
				alert("Senha inválida")
				transferencia()
			}
		}





		inicio();
	</script>
</head>
