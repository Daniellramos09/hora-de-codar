<body>
    <script>

        var qttConvidados = Number(prompt("Digite o número de convidados: "));
        var horas = Number(prompt("Quantidade de horas do evento:"));
        var qttGarcon = Math.ceil(qttConvidados / 12) + Math.floor(horas / 2);
        var custo = qttGarcon * horas * 10.50;

        HotelTerabithia.atualizarEvento({
            garcons: qttGarcon,
            duracaoGarcons: horas,
            custoGarcons: custo
        });
        alert("Quantidade de garçons: " + qttGarcon);






    </script>
