<html>

<head>
	<script src="shared.js"></script>

	<script>

		var nomeHotel = "Palantir";
		var usuario = sessionStorage.getItem("hotelUsuario");
		var acessoLiberado = Boolean(usuario);

		if (!acessoLiberado) {
			alert("Bem-vindo ao " + nomeHotel);
			usuario = prompt("Digite seu nome:");
			if (usuario && usuario.trim()) {
				usuario = usuario.trim();
				for (let tentativa = 1; tentativa <= 3; tentativa++) {
					const senha = prompt("Digite sua senha:");
					if (senha === "2678") {
						acessoLiberado = true;
						sessionStorage.setItem("hotelUsuario", usuario);
						alert(`Bem-vindo ao Hotel ${nomeHotel}, ${usuario}. É um imenso prazer ter você por aqui!`);
						break;
					}
					alert(`Senha errada. Tentativa: ${tentativa}`);
				}
			}
			if (!acessoLiberado) {
				alert("Acesso bloqueado.");
			}
		}

		function inicio() {
			var escolha = Number(prompt(
				"Menu do Hotel " + nomeHotel +
				"\n1. Reservas de quartos\n2. Cadastro de hóspedes\n3. Eventos\n4. Ar-condicionado\n5. Abastecimento\n6. Relatórios operacionais\n7. Sair"
			));

			if (escolha === 1) {
				reserva_quartos();
			} else if (escolha === 2) {
				window.location.href = "CadastroDeHospedes.html";
			} else if (escolha === 3) {
				window.location.href = "Eventos.html";
			} else if (escolha === 4) {
				window.location.href = "ArCondicionado.html";
			} else if (escolha === 5) {
				window.location.href = "Abastecimento.html";
			} else if (escolha === 6) {
				window.location.href = "Relatorios.html";
			} else if (escolha === 7) {
				sair();
			} else {
				erro();
			}
		}


		

		let estadoHotel = HotelTerabithia.lerEstado();
		let quartos = estadoHotel.quartos;

		function reserva_quartos() {

			alert("HOTEL " + nomeHotel + " - RESERVA DE QUARTOS");

			// 1. Valor da diária
			let valorDiaria = Number(
				prompt("Informe o valor da diária:")
			);

			// 2. Quantidade de diárias
			let qtt = Number(
				prompt("Informe a quantidade de diárias (1-30):")
			);



			if (!Number.isFinite(valorDiaria) || valorDiaria <= 0
				|| !Number.isInteger(qtt) || qtt < 1 || qtt > 30) {

				alert("Valor inválido, " + usuario);

				inicio();
				return;
			}



			let nomeHospede = prompt(
				"Informe o nome completo do hóspede:"
			);



			let tipoQuarto = (prompt(
				"Tipo de quarto:\n" +
				"S - Standard\n" +
				"E - Executivo\n" +
				"L - Luxo"
			) || "").trim().toUpperCase();


			let fator;


			if (tipoQuarto === "S") {

				fator = 1.00;

			} else if (tipoQuarto === "E") {

				fator = 1.35;

			} else if (tipoQuarto === "L") {

				fator = 1.65;

			} else {

				alert("Tipo de quarto inválido.");
				inicio();
				return;
			}


			

			let quartoEscolhido = Number(prompt("Escolha um quarto de 1 a 20:"));
			if (!Number.isInteger(quartoEscolhido) || quartoEscolhido < 1 || quartoEscolhido > 20) {
				alert("Escolha um quarto entre 1 e 20.");
				inicio();
				return;
			}

			let posicao = quartoEscolhido - 1;
			if (quartos[posicao] === "O") {
				alert("Quarto já está ocupado.");
				mostrar_quartos_livres();
				inicio();
				return;
			}


		

			let subtotal = valorDiaria * qtt * fator;

			let taxaServico = subtotal * 0.10;

			let total = subtotal + taxaServico;


		
			alert(
				"Resumo da reserva\n\n" +
				"Hóspede: " + nomeHospede + "\n" +
				"Quarto: " + quartoEscolhido + "\n" +
				"Tipo: " + tipoQuarto + "\n" +
				"Subtotal: " + HotelTerabithia.formatarMoeda(subtotal) + "\n" +
				"Taxa de serviço: " + HotelTerabithia.formatarMoeda(taxaServico) + "\n" +
				"Total: " + HotelTerabithia.formatarMoeda(total)
			);



			let confirmar = (prompt(
				nomeHospede + ", confirma a reserva? (S/N)"
			) || "").trim().toUpperCase();


			if (confirmar === "S") {

				// Marca o quarto como ocupado
				quartos[posicao] = "O";
				estadoHotel = HotelTerabithia.lerEstado();
				estadoHotel.quartos = quartos;
				estadoHotel.reservas.push({
					hospede: nomeHospede,
					quarto: quartoEscolhido,
					tipoQuarto,
					total,
					data: new Date().toISOString()
				});
				HotelTerabithia.salvarEstado(estadoHotel);

				alert("Reserva efetuada com sucesso.");

				mostrar_mapa_quartos();

			} else {

				alert("Reserva não efetuada.");
			}


			inicio();
		}


	

		function mostrar_quartos_livres() {

			let livres = "Quartos disponíveis:\n";

			for (let i = 0; i < quartos.length; i++) {

				if (quartos[i] === "L") {
					livres += (i + 1) + "\n";
				}
			}

			alert(livres);
		}


		

		function mostrar_mapa_quartos() {

			let mapa = "";

			for (let i = 0; i < quartos.length; i++) {

				mapa += "Quarto " + (i + 1) + ": " + quartos[i] + "\n";

				// Quebra a cada 5 quartos
				if ((i + 1) % 5 === 0) {
					mapa += "\n";
				}
			}

			alert(
				"MAPA DOS QUARTOS\n\n" +
				"L = Livre | O = Ocupado\n\n" +
				mapa
			);
		}



		function erro() {
			alert('Por favor, informe um número entre 1 e 7');
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {
				alert("Muito obrigado e até logo, " + usuario + ".");
				sessionStorage.removeItem("hotelUsuario");
			} else {
				inicio();
			}
		}



		if (acessoLiberado) {
			inicio();
		}
	</script>
</head>

<body>

</body>

</html>
