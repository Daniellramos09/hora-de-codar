        var comando;
        var listaContato = [];


        function inicio() {

            comando = String(prompt("Digite um comando: (ADICIONAR, BUSCAR, REMOVER, LISTAR, SAIR)"))


            if (comando === 'ADICIONAR') {
                adicionarContato();
            }

            else if (comando === "BUSCAR") {
                buscarContato()
            }
            else if (comando === "REMOVER") {
                remover();
            }
            else if (comando === "LISTAR"){
                listar()
            }
            else if (comando === "SAIR"){
                sair()
            }

            else {
                erro()
            }


        }

        var soma = 0
        function adicionarContato() {
            if (comando === 'ADICIONAR') {

                var nome = String(prompt("Nome:"))
                var telefone = String(prompt("Telefone: "))

                if (nome == ' ') {
                    alert("Contato não encontrado")
                    inicio();
                }
                else {
                    var contato = {
                        nome: nome,
                        telefone: telefone
                    };

                    listaContato.push(contato);

                    alert("Contato Adicionado!")
                    soma++;
                    alert(JSON.stringify(listaContato))
                    inicio();
                }


            }


        }

        var encontrar;
        function buscarContato() {

            encontrar = String(prompt("Qual contato quer encontrar? "))

            var achou = listaContato.find(function (item) {
                return item.nome === encontrar;
            });

            if (achou) {
                alert("Contato encontrado! Número do Contato: " + achou.telefone);
                inicio();
            }
            else {
                alert("Contato inexistente.")
                inicio();
            }
        }

        function remover() {
            remover = String(prompt("Qual contato quer remover? "))



            var indice = listaContato.findIndex(function (item) {
                return item.nome === remover;
            });



            if (indice !== -1) {
                listaContato.indexOf(indice, 1)
                alert("Contato encontrado e removido da lista");
                inicio();
            }
            else {
                alert("Contato inexistente.")
                inicio();
            }
        }

        function listar() {
            alert("Lista de todos os contatos: " + JSON.stringify(listaContato))
            inicio()
        }

        function sair(){
            alert("Agenda encerrada. Total de contatos: " +  soma)

        }



        inicio();


        function erro() {
            alert("teste")
        }
